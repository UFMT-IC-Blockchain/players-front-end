<div class="global-error-container" *ngIf="globalError$ | async as err">
  <app-alert
    class="global-alert"
    type="error"
    title="Atenção"
    [message]="err.message"
    [dismissible]="true"
    (dismissed)="dismissGlobalError()"
    role="alert"
    aria-live="polite"
  ></app-alert>
</div>

<div class="feedback-container" *ngIf="feedbackMessages$ | async as msgs">
  <app-alert
    *ngFor="let msg of msgs; trackBy: trackByFeedbackId"
    class="feedback-alert"
    [type]="msg.type"
    [title]="msg.title ?? null"
    [message]="msg.message"
    [dismissible]="true"
    (dismissed)="dismissFeedback(msg.id)"
    role="status"
    aria-live="polite"
  ></app-alert>
</div>
