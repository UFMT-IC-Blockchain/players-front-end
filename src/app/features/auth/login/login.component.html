<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>
    
    <app-alert *ngIf="errorMessage" type="error" [message]="errorMessage"></app-alert>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="login">Username</label>
        <input 
          id="login" 
          type="text" 
          formControlName="login" 
          placeholder="Enter your username"
          [ngClass]="{'is-invalid': loginForm.get('login')?.invalid && loginForm.get('login')?.touched}"
        >
        <div class="error-message" *ngIf="loginForm.get('login')?.invalid && loginForm.get('login')?.touched">
          Username is required.
        </div>
      </div>

      <div class="form-group">
        <label for="senha">Password</label>
        <input 
          id="senha" 
          type="password" 
          formControlName="senha" 
          placeholder="Enter your password"
          [ngClass]="{'is-invalid': loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched}"
        >
        <div class="error-message" *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched">
          Password is required.
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-primary">
        <span *ngIf="!isLoading">Entrar</span>
        <app-spinner *ngIf="isLoading" [inline]="true" size="sm" label="Carregando..."></app-spinner>
      </button>
      
    </form>
  </div>
</div>
