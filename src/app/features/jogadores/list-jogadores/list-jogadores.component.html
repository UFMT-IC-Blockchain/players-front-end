<div class="list-container">
  <div class="header-section">
    <div class="title-wrapper">
      <h2>Jogadores</h2>
      <p>Gerencie os atletas cadastrados no sistema</p>
    </div>
    <div class="actions-row">
      <button class="btn-secondary" routerLink="/jogadores/busca">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Busca Rápida
      </button>
      <button *ngIf="isAdmin" class="btn-primary" (click)="openCreateModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Novo Jogador
      </button>
    </div>
  </div>

  <div *ngIf="status === 'loading'" class="loading-state">
    <app-spinner size="lg" label="Carregando jogadores..."></app-spinner>
  </div>

  <app-alert *ngIf="status === 'error'" type="error" [message]="errorMessage">
    <button actions class="btn-primary" type="button" (click)="loadJogadores()">Tentar novamente</button>
  </app-alert>

  <div *ngIf="status === 'ready'" class="cards-grid">
    <div *ngFor="let jogador of jogadores; trackBy: trackByJogadorId" class="glass-card jogador-card">
      <div class="player-header">
        <div class="avatar">👤</div>
        <div class="player-info">
          <h3>{{ jogador.nome || '[Sem nome]' }}</h3>
          <span class="wallet">{{ jogador.carteiraStellar | slice:0:8 }}...{{ jogador.carteiraStellar | slice:-8 }}</span>
        </div>
      </div>

      <div class="team-tag" *ngIf="jogador.idTime">
        <span class="label">Time:</span>
        <a [routerLink]="['/times', jogador.idTime.id]" class="value">{{ jogador.idTime.nome }}</a>
      </div>

      <div class="admin-actions" *ngIf="isAdmin">
        <button class="btn-icon" (click)="openEditModal(jogador)" title="Editar">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
        <button class="btn-icon delete" (click)="openDeleteConfirm(jogador)" title="Excluir">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<app-modal
  [isOpen]="isModalOpen"
  [title]="jogadorToDelete ? 'Excluir Jogador' : (isEditing ? 'Editar Jogador' : 'Novo Jogador')"
  [confirmText]="jogadorToDelete ? 'Excluir' : 'Salvar'"
  (confirmed)="confirmAction()"
  (closed)="closeModal()"
>
  <div *ngIf="jogadorToDelete">
    Tem certeza que deseja excluir o jogador <strong>{{ jogadorToDelete.nome }}</strong>?
  </div>
  
  <div *ngIf="!jogadorToDelete" class="modern-form">
    <div class="form-group">
      <label>Nome Completo</label>
      <input type="text" [(ngModel)]="form.nome" class="form-control" placeholder="Ex: João Silva">
    </div>
    <div class="form-group">
      <label>Carteira Stellar (G...)</label>
      <input type="text" [(ngModel)]="form.wallet" class="form-control" placeholder="G...">
    </div>
    <div class="form-group">
      <label>Time Vinculado</label>
      <select [(ngModel)]="form.timeId" class="form-control">
        <option [ngValue]="null">Nenhum</option>
        <option *ngFor="let t of times" [ngValue]="t.id">{{ t.nome }}</option>
      </select>
    </div>
  </div>
</app-modal>
