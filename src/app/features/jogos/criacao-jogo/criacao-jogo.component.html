<div class="container">
  <div class="glass-card form-wrapper">
    <div class="header">
      <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/></svg>
      </div>
      <h1>Novo Jogo</h1>
      <p>Configure as especificações da partida</p>
    </div>

    <form [formGroup]="jogoForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="label-text" for="duracao">Duração da Partida (minutos)</label>
        <div class="input-wrapper">
          <input 
            type="number" 
            id="duracao" 
            class="input-field" 
            placeholder="Ex: 90"
            formControlName="duracao"
            [class.invalid]="jogoForm.get('duracao')?.invalid && jogoForm.get('duracao')?.touched"
          >
          <span class="unit-badge">min</span>
        </div>
        
        <div class="error-container">
          <span class="error-text" *ngIf="jogoForm.get('duracao')?.errors?.['required'] && jogoForm.get('duracao')?.touched">
            A duração é obrigatória.
          </span>
          <span class="error-text" *ngIf="jogoForm.get('duracao')?.errors?.['min'] && jogoForm.get('duracao')?.touched">
            Duração mínima de 1 minuto.
          </span>
          <span class="error-text" *ngIf="jogoForm.get('duracao')?.errors?.['max'] && jogoForm.get('duracao')?.touched">
            Duração máxima de 300 minutos.
          </span>
        </div>
      </div>

      <div class="alert error" *ngIf="errorMessage">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ errorMessage }}
      </div>

      <div class="actions">
        <button type="button" class="btn-secondary" routerLink="/jogos">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="jogoForm.invalid || isLoading">
          <span *ngIf="!isLoading">Criar Jogo</span>
          <span *ngIf="isLoading" class="loader"></span>
        </button>
      </div>
    </form>
  </div>
</div>
