<div class="detail-container">
  
  <div class="header">
    <button class="btn-voltar" (click)="voltar()">← Voltar</button>
    <h2 *ngIf="jogo">Jogo #{{ jogo.id }}</h2> 
  </div>

  <div class="loading-state card" *ngIf="isLoading">
    <p>Carregando informações do jogo...</p>
  </div>

  <div class="error-alert" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="content" *ngIf="!isLoading && !errorMessage && jogo">
    
    <div class="card">
      <h3 class="card-title">Dados do jogo</h3>
      <div class="card-body">
        <p><span class="label">ID:</span> {{ jogo.id }}</p>
        
        <p *ngIf="jogo.duracao"><span class="label">Duração:</span> {{ jogo.duracao }}</p>
        <p *ngIf="jogo.status"><span class="label">Status:</span> {{ jogo.status }}</p>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">Resultados</h3>
      
      <div *ngIf="resultados.length === 0" class="empty-state">
        <p>Nenhum resultado registrado para este confronto.</p>
      </div>

      <ul class="resultados-list" *ngIf="resultados.length > 0">
        <li *ngFor="let res of resultados" class="resultado-item">
          <span class="time-nome">{{ res.time }}</span>
          <span class="time-pontos">{{ res.pontos }} pts</span>
        </li>
      </ul>
    </div>

  </div>
</div>
